<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Dr Nader Mosaad — Pharmacy Student</title>
<meta name="description" content="Dr Nader Mosaad — Pharmacy student at Deraya University. Personal profile and contact links." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#05090E;
    --bg-1:#080D14;
    --card:#0C131B;
    --card-line:rgba(143,165,173,0.14);
    --accent:#1CE1C0;
    --accent-2:#588AFF;
    --text:#F5FFFF;
    --text-2:#8FA5AD;
    --glass:rgba(12,19,27,0.55);
    --glass-strong:rgba(12,19,27,0.72);
    --shadow-color: 0 0% 0%;
    --ring-size: 168px;
    --wa: #22C57C;
    --wa-2:#17A868;
    --radius-lg: 26px;
    --radius-md: 18px;
    --radius-sm: 13px;
    --ease: cubic-bezier(.16,.84,.44,1);
    color-scheme: dark;
  }

  html[data-theme="light"]{
    --bg-0:#F3F7F7;
    --bg-1:#EAF2F1;
    --card:#FFFFFF;
    --card-line:rgba(20,60,60,0.10);
    --accent:#0EA88F;
    --accent-2:#3F6FE0;
    --text:#0B1B1E;
    --text-2:#5B7278;
    --glass:rgba(255,255,255,0.62);
    --glass-strong:rgba(255,255,255,0.82);
    --wa:#1FAE72;
    --wa-2:#128B5A;
    color-scheme: light;
  }

  *{ box-sizing: border-box; }
  ::selection{ background: var(--accent); color:#031013; }

  html,body{ height:100%; }

  body{
    margin:0;
    min-height:100svh;
    background: var(--bg-0);
    color: var(--text);
    font-family: 'Manrope', 'Cairo', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x:hidden;
    transition: background .6s var(--ease), color .6s var(--ease);
    position:relative;
  }

  html[lang="ar"] body{ font-family:'Cairo','Manrope', system-ui, sans-serif; }

  /* ---------------- Ambient background ---------------- */
  .ambient{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(60% 50% at 18% 8%, color-mix(in srgb, var(--accent) 20%, transparent) 0%, transparent 60%),
      radial-gradient(55% 45% at 88% 18%, color-mix(in srgb, var(--accent-2) 18%, transparent) 0%, transparent 60%),
      radial-gradient(70% 60% at 50% 100%, color-mix(in srgb, var(--accent) 10%, transparent) 0%, transparent 65%),
      var(--bg-0);
    opacity:0;
    animation: ambientIn 1.6s var(--ease) forwards;
    transition: background .6s var(--ease);
  }
  .ambient::before, .ambient::after{
    content:"";
    position:absolute;
    width:52vmax; height:52vmax;
    border-radius:50%;
    filter: blur(90px);
    opacity:.16;
    will-change: transform;
  }
  .ambient::before{
    background: var(--accent);
    top:-18vmax; left:-14vmax;
    animation: floatA 22s ease-in-out infinite;
  }
  .ambient::after{
    background: var(--accent-2);
    bottom:-20vmax; right:-16vmax;
    animation: floatB 26s ease-in-out infinite;
  }
  @keyframes ambientIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes floatA{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(4vmax, 6vmax) scale(1.08); }
  }
  @keyframes floatB{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(-5vmax, -4vmax) scale(1.1); }
  }

  .grain{
    position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.035; mix-blend-mode: overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* ---------------- Top bar ---------------- */
  .topbar{
    position:relative; z-index:5;
    max-width:520px; margin:0 auto;
    padding: 22px 20px 0;
    display:flex; align-items:center; justify-content:space-between;
    opacity:0; transform: translateY(-10px);
    animation: dropIn .7s var(--ease) .15s forwards;
  }
  @keyframes dropIn{ to{ opacity:1; transform:none; } }

  .pill-group{
    display:flex; align-items:center; gap:6px;
    background: var(--glass);
    border:1px solid var(--card-line);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    padding:4px; border-radius:999px;
    box-shadow: 0 4px 20px rgba(0,0,0,.25);
  }
  .pill-btn{
    appearance:none; border:none; background:transparent; cursor:pointer;
    color: var(--text-2);
    font-family:inherit; font-size:12.5px; font-weight:700; letter-spacing:.02em;
    padding:8px 14px; border-radius:999px;
    transition: color .35s var(--ease), background .35s var(--ease), transform .2s var(--ease);
  }
  .pill-btn[aria-pressed="true"]{
    color:#031013;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 4px 16px color-mix(in srgb, var(--accent) 45%, transparent);
  }
  .pill-btn:hover{ transform: translateY(-1px); }
  .pill-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .theme-toggle{
    width:42px; height:42px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: var(--glass);
    border:1px solid var(--card-line);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    color: var(--accent);
    cursor:pointer;
    box-shadow: 0 4px 20px rgba(0,0,0,.25);
    transition: transform .4s var(--ease), background .35s var(--ease), color .35s var(--ease);
  }
  .theme-toggle:hover{ transform: translateY(-2px) rotate(-8deg); }
  .theme-toggle:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
  .theme-toggle svg{ width:19px; height:19px; }
  .theme-toggle .sun{ display:none; }
  html[data-theme="light"] .theme-toggle .moon{ display:none; }
  html[data-theme="light"] .theme-toggle .sun{ display:block; }

  /* ---------------- Layout ---------------- */
  main{
    position:relative; z-index:5;
    max-width:520px; margin:0 auto;
    padding: 34px 18px 60px;
  }

  .card{
    position:relative;
    background: linear-gradient(180deg, var(--glass-strong), var(--glass));
    border:1px solid var(--card-line);
    border-radius: var(--radius-lg);
    padding: 44px 26px 32px;
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    box-shadow: 0 30px 80px -30px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.03);
    opacity:0;
    filter: blur(6px);
    transform: translateY(22px) scale(.98);
    animation: cardIn .9s var(--ease) .1s forwards;
    overflow:hidden;
  }
  @keyframes cardIn{ to{ opacity:1; filter:blur(0); transform:none; } }

  .card::before{
    content:"";
    position:absolute; inset:-1px;
    border-radius: inherit;
    padding:1px;
    background: linear-gradient(120deg, color-mix(in srgb, var(--accent) 50%, transparent), transparent 35%, transparent 65%, color-mix(in srgb, var(--accent-2) 45%, transparent));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events:none;
    opacity:.7;
    animation: borderSpin 10s linear infinite;
  }
  @keyframes borderSpin{
    0%{ filter:hue-rotate(0deg); }
    100%{ filter:hue-rotate(18deg); }
  }

  /* ---------------- Profile ---------------- */
  .profile-wrap{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    gap:14px;
  }

  .avatar-shell{
    position:relative;
    width: var(--ring-size); height: var(--ring-size);
    display:flex; align-items:center; justify-content:center;
    opacity:0; transform: scale(.8);
    animation: avatarIn .8s var(--ease) .35s forwards;
  }
  @keyframes avatarIn{ to{ opacity:1; transform:scale(1); } }

  .avatar-pulse{
    position:absolute; inset:-14px; border-radius:50%;
    border:1px solid color-mix(in srgb, var(--accent) 55%, transparent);
    animation: pulseRing 3.2s var(--ease) infinite;
  }
  .avatar-pulse.delay{ animation-delay:1.1s; }
  @keyframes pulseRing{
    0%{ transform:scale(.86); opacity:.55; }
    70%{ transform:scale(1.18); opacity:0; }
    100%{ opacity:0; }
  }

  .avatar-ring{
    position:absolute; inset:-6px; border-radius:50%;
    background: conic-gradient(from 0deg, var(--accent), var(--accent-2), var(--accent) 70%, var(--accent-2) 100%);
    animation: ringSpin 7s linear infinite;
    filter: saturate(1.15);
  }
  .avatar-ring::after{
    content:""; position:absolute; inset:5px; border-radius:50%;
    background: var(--card);
  }
  @keyframes ringSpin{ to{ transform: rotate(360deg); } }

  .avatar-glow{
    position:absolute; inset:-6px; border-radius:50%;
    box-shadow: 0 0 44px 6px color-mix(in srgb, var(--accent) 34%, transparent);
    animation: glowBreathe 3.6s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes glowBreathe{
    0%,100%{ opacity:.55; } 50%{ opacity:1; }
  }

  .avatar-img{
    position:relative; z-index:2;
    width: calc(var(--ring-size) - 18px);
    height: calc(var(--ring-size) - 18px);
    border-radius:50%;
    object-fit:cover;
    display:block;
    border: 3px solid var(--card);
    transition: transform .5s var(--ease);
  }
  .avatar-shell:hover .avatar-img{ transform: scale(1.035); }

  .badge{
    display:inline-flex; align-items:center; gap:7px;
    padding:7px 16px 7px 12px;
    border-radius:999px;
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 20%, var(--card)), color-mix(in srgb, var(--accent-2) 16%, var(--card)));
    border:1px solid color-mix(in srgb, var(--accent) 40%, var(--card-line));
    font-size:12px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    color: var(--accent);
    opacity:0; transform: translateY(10px);
    animation: fadeUp .6s var(--ease) .75s forwards;
  }
  html[lang="ar"] .badge{ letter-spacing:0; }
  .badge .pill-emoji{ font-size:15px; filter: saturate(1.2); }

  @keyframes fadeUp{ to{ opacity:1; transform:none; } }

  .name{
    margin: 14px 0 2px;
    font-family:'Space Grotesk','Manrope', sans-serif;
    font-size: clamp(26px, 6vw, 32px);
    font-weight:700; letter-spacing:-0.01em;
    background: linear-gradient(120deg, var(--text) 40%, color-mix(in srgb, var(--accent) 70%, var(--text)));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    opacity:0; transform: translateY(10px);
    animation: fadeUp .6s var(--ease) .9s forwards;
  }
  html[lang="ar"] .name{ font-family:'Cairo','Manrope',sans-serif; }

  .subtitle{
    margin:0; font-size:14.5px; color: var(--text-2); font-weight:500;
    letter-spacing:.01em;
    opacity:0; transform: translateY(10px);
    animation: fadeUp .6s var(--ease) 1.02s forwards;
  }

  /* ---------------- Info cards ---------------- */
  .info-grid{
    display:grid; grid-template-columns: repeat(3, 1fr);
    gap:10px;
    margin: 30px 0 8px;
  }
  @media (max-width:380px){
    .info-grid{ grid-template-columns: 1fr; }
  }

  .info-card{
    background: color-mix(in srgb, var(--card) 60%, transparent);
    border:1px solid var(--card-line);
    border-radius: var(--radius-md);
    padding: 16px 12px;
    text-align:center;
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 26px -14px rgba(0,0,0,.5);
    opacity:0; transform: translateY(16px);
    animation: fadeUp .6s var(--ease) forwards;
    transition: transform .4s var(--ease), border-color .4s var(--ease), box-shadow .4s var(--ease);
  }
  .info-card:nth-child(1){ animation-delay:1.12s; }
  .info-card:nth-child(2){ animation-delay:1.22s; }
  .info-card:nth-child(3){ animation-delay:1.32s; }
  .info-card:hover{
    transform: translateY(-4px);
    border-color: color-mix(in srgb, var(--accent) 45%, var(--card-line));
    box-shadow: 0 16px 34px -16px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .info-icon{ font-size:19px; display:block; margin-bottom:8px; }
  .info-label{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.09em;
    color: var(--text-2); font-weight:700; margin:0 0 5px;
  }
  html[lang="ar"] .info-label{ letter-spacing:0; }
  .info-value{ font-size:13px; font-weight:600; color: var(--text); margin:0; line-height:1.35; }

  /* ---------------- Divider ---------------- */
  .divider{
    height:1px; margin: 26px 2px 22px;
    background: linear-gradient(90deg, transparent, var(--card-line) 20%, var(--card-line) 80%, transparent);
    opacity:0; animation: fadeUp .6s var(--ease) 1.4s forwards;
  }

  /* ---------------- Social links ---------------- */
  .links{ display:flex; flex-direction:column; gap:12px; }

  .link-btn{
    position:relative;
    display:flex; align-items:center; gap:14px;
    padding: 15px 18px;
    border-radius: var(--radius-md);
    background: color-mix(in srgb, var(--card) 70%, transparent);
    border:1px solid var(--card-line);
    text-decoration:none;
    color: var(--text);
    overflow:hidden;
    isolation:isolate;
    opacity:0; transform: translateY(16px);
    animation: fadeUp .6s var(--ease) forwards;
    transition: transform .35s var(--ease), border-color .35s var(--ease), box-shadow .35s var(--ease), background .35s var(--ease);
  }
  .link-btn:nth-child(1){ animation-delay:1.5s; }
  .link-btn:nth-child(2){ animation-delay:1.6s; }
  .link-btn:nth-child(3){ animation-delay:1.7s; }
  .link-btn:nth-child(4){ animation-delay:1.8s; }

  .link-btn::before{
    content:""; position:absolute; inset:0; z-index:-1;
    background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.10) 45%, rgba(255,255,255,.16) 50%, rgba(255,255,255,.10) 55%, transparent 70%);
    transform: translateX(-120%);
    transition: none;
  }
  .link-btn:hover::before{ animation: sweep 1.1s var(--ease); }
  @keyframes sweep{ to{ transform: translateX(120%); } }

  .link-btn:hover{
    transform: translateY(-3px) scale(1.012);
    border-color: color-mix(in srgb, var(--accent) 40%, var(--card-line));
    box-shadow: 0 18px 40px -18px color-mix(in srgb, var(--accent) 34%, transparent);
  }
  .link-btn:active{ transform: translateY(-1px) scale(1.0); }
  .link-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  .link-icon{
    flex:0 0 auto;
    width:42px; height:42px; border-radius:13px;
    display:flex; align-items:center; justify-content:center;
    color:#fff;
  }
  .link-icon svg{ width:21px; height:21px; }

  .link-text{ flex:1; display:flex; flex-direction:column; gap:1px; min-width:0; }
  .link-name{ font-weight:700; font-size:15px; letter-spacing:.01em; }
  .link-sub{ font-size:11.5px; color: var(--text-2); font-weight:500; }

  .link-arrow{ flex:0 0 auto; color: var(--text-2); transition: transform .35s var(--ease), color .35s var(--ease); }
  .link-btn:hover .link-arrow{ transform: translateX(4px); color: var(--accent); }
  html[dir="rtl"] .link-btn:hover .link-arrow{ transform: translateX(-4px); }
  html[dir="rtl"] .link-arrow svg{ transform: scaleX(-1); }

  .ic-facebook{ background: linear-gradient(135deg,#1877F2,#0E5FCB); }
  .ic-instagram{ background: linear-gradient(135deg,#F58529,#DD2A7B 45%,#8134AF 75%,#515BD4); }
  .ic-tiktok{ background: linear-gradient(135deg,#111318,#000); }
  .ic-whatsapp{ background: linear-gradient(135deg, var(--wa), var(--wa-2)); }

  .link-btn.cta{
    background: linear-gradient(135deg, color-mix(in srgb, var(--wa) 20%, var(--card)), color-mix(in srgb, var(--wa-2) 14%, var(--card)));
    border-color: color-mix(in srgb, var(--wa) 45%, var(--card-line));
    box-shadow: 0 14px 34px -18px color-mix(in srgb, var(--wa) 55%, transparent);
  }
  .link-btn.cta:hover{
    box-shadow: 0 20px 46px -16px color-mix(in srgb, var(--wa) 60%, transparent);
  }
  .link-btn.cta .link-name{ color: color-mix(in srgb, var(--wa) 92%, var(--text)); }

  /* ---------------- Footer ---------------- */
  footer{
    text-align:center; margin-top:30px;
    font-size:11.5px; color: var(--text-2);
    opacity:0; animation: fadeUp .6s var(--ease) 2s forwards;
  }
  footer .dot{ color: var(--accent); margin: 0 6px; }

  /* ---------------- Reduced motion ---------------- */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
      scroll-behavior:auto !important;
    }
    .ambient::before, .ambient::after, .avatar-ring, .avatar-pulse, .avatar-glow{ animation: none !important; }
  }

  [data-i18n], [data-i18n-ar]{ transition: opacity .25s var(--ease); }
  .i18n-fade{ opacity:0 !important; }
</style>
</head>
<body>

<div class="ambient" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div class="topbar">
  <div class="pill-group" role="group" aria-label="Language switcher">
    <button type="button" class="pill-btn" id="lang-en" aria-pressed="true">EN</button>
    <button type="button" class="pill-btn" id="lang-ar" aria-pressed="false">العربية</button>
  </div>
  <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle dark or light theme" aria-pressed="false">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  </button>
</div>

<main>
  <section class="card" aria-labelledby="profile-name">

    <div class="profile-wrap">
      <div class="avatar-shell">
        <span class="avatar-pulse" aria-hidden="true"></span>
        <span class="avatar-pulse delay" aria-hidden="true"></span>

      });
      root.setAttribute('lang', lang);
      root.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
      btnEn.setAttribute('aria-pressed', String(lang === 'en'));
      btnAr.setAttribute('aria-pressed', String(lang === 'ar'));
      nodes.forEach(function(el){ el.classList.remove('i18n-fade'); });
    };

    if(!animate){ setNow(); return; }

    nodes.forEach(function(el){ el.classList.add('i18n-fade'); });
    window.setTimeout(setNow, 220);

    try{ localStorage.setItem('nm-lang', lang); }catch(e){}
  }

  function applyTheme(theme, persist){
    root.setAttribute('data-theme', theme);
    themeBtn.setAttribute('aria-pressed', String(theme === 'light'));
    if(persist){
      try{ localStorage.setItem('nm-theme', theme); }catch(e){}
    }
  }

  btnEn.addEventListener('click', function(){ applyLang('en', true); });
  btnAr.addEventListener('click', function(){ applyLang('ar', true); });

  themeBtn.addEventListener('click', function(){
    var current = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    applyTheme(current === 'dark' ? 'light' : 'dark', true);
  });

  var savedLang = 'en', savedTheme = null;
  try{ savedLang = localStorage.getItem('nm-lang') || 'en'; }catch(e){}
  try{ savedTheme = localStorage.getItem('nm-theme') || null; }catch(e){}

  applyLang(savedLang, false);
  applyTheme(savedTheme || 'dark', false);

  /* ---------------- Dynamic content from the CMS ---------------- */
  var ICONS = {
    facebook:  { cls:'ic-facebook',  svg:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5.02 3.66 9.18 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.51 1.49-3.9 3.77-3.9 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.87h2.78l-.44 2.91h-2.34V22c4.78-.76 8.44-4.92 8.44-9.94z"/></svg>' },
    instagram: { cls:'ic-instagram', svg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>' },
    tiktok:    { cls:'ic-tiktok',    svg:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 3c.3 2.1 1.6 3.6 3.7 3.9v2.6c-1.3.1-2.5-.3-3.6-1v6.1c0 3-2.4 5.4-5.5 5.4S5.6 17.6 5.6 14.6c0-2.9 2.2-5.2 5-5.4v2.7c-1.3.2-2.3 1.3-2.3 2.7 0 1.5 1.3 2.8 2.9 2.8s2.9-1.2 2.9-2.8V3h2.4z"/></svg>' },
    whatsapp:  { cls:'ic-whatsapp',  svg:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.7-.8-1.9-.9-.3-.1-.5-.1-.6.1-.2.3-.7.9-.9 1-.2.2-.3.2-.6.1-.3-.1-1.2-.4-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.1.2-.3.3-.4.1-.2 0-.3 0-.5s-.6-1.6-.9-2.1c-.2-.5-.4-.5-.6-.5h-.5c-.2 0-.5.1-.7.3-.2.3-1 1-1 2.3 0 1.4 1 2.7 1.1 2.9.1.2 2 3 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 1.9-1.4.2-.6.2-1.2.2-1.3-.1-.2-.3-.2-.6-.3z"/><path d="M12 2C6.5 2 2 6.5 2 12c0 1.9.5 3.6 1.4 5.1L2 22l5-1.3c1.4.8 3.1 1.2 4.9 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18.3c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3 .8.8-2.9-.2-.3C4 15.1 3.5 13.6 3.5 12c0-4.7 3.8-8.5 8.5-8.5s8.5 3.8 8.5 8.5-3.8 8.5-8.5 8.5z"/></svg>' },
    telegram:  { cls:'ic-telegram',  svg:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3 2.6 11.9c-1 .4-1 1.5.1 1.8l4.7 1.5 1.8 5.8c.2.7 1 .9 1.6.4l2.6-2.3 4.8 3.6c.7.5 1.7.1 1.9-.7l3.1-15.6c.2-1-.8-1.8-1.7-1.4zM8.8 14.6l9-6.6c.3-.2.6.1.3.4l-7.4 7.1-.3 3-1.6-3.9z"/></svg>' },
    linkedin:  { cls:'ic-linkedin',  svg:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM9 9h3.8v1.7h.1c.5-1 1.8-2 3.7-2 4 0 4.7 2.6 4.7 6V21h-4v-5.3c0-1.3 0-2.9-1.8-2.9s-2 1.4-2 2.8V21H9z"/></svg>' },
    youtube:   { cls:'ic-youtube',   svg:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 12s0-3.5-.4-5.2c-.3-.9-1-1.6-1.9-1.9C19 4.5 12 4.5 12 4.5s-7 0-8.7.4c-.9.3-1.6 1-1.9 1.9C1 8.5 1 12 1 12s0 3.5.4 5.2c.3.9 1 1.6 1.9 1.9 1.7.4 8.7.4 8.7.4s7 0 8.7-.4c.9-.3 1.6-1 1.9-1.9.4-1.7.4-5.2.4-5.2zM9.8 15.5v-7l6 3.5-6 3.5z"/></svg>' },
    website:   { cls:'ic-website',   svg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z"/></svg>' },
    email:     { cls:'ic-website',   svg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>' },
    phone:     { cls:'ic-whatsapp',  svg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.4 2.1L8.1 9.7a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.9 2.2z"/></svg>' }
  };
  var extraIconStyle = document.createElement('style');
  extraIconStyle.textContent = '.ic-telegram{background:linear-gradient(135deg,#2AABEE,#229ED9);} .ic-linkedin{background:linear-gradient(135deg,#0A66C2,#004182);} .ic-youtube{background:linear-gradient(135deg,#FF0000,#CC0000);} .ic-website{background:linear-gradient(135deg,var(--accent),var(--accent-2));}';
  document.head.appendChild(extraIconStyle);

  function escapeHtml(s){
    return String(s || '').replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  function renderLinks(links, lang){
    var nav = document.getElementById('links-nav');
    if(!nav) return;
    nav.innerHTML = '';
    links.forEach(function(link, i){
      var icon = ICONS[link.platform] || ICONS.website;
      var a = document.createElement('a');
      a.className = 'link-btn' + (link.style === 'cta' ? ' cta' : '');
      a.href = link.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.style.animationDelay = (1.5 + i * 0.1) + 's';
      var name = (lang === 'ar' && link.name_ar) ? link.name_ar : link.name_en;
      var sub = (lang === 'ar' && link.sub_ar) ? link.sub_ar : link.sub_en;
      a.setAttribute('aria-label', name);
      a.innerHTML =
        '<span class="link-icon ' + icon.cls + '" aria-hidden="true">' + icon.svg + '</span>' +
        '<span class="link-text">' +
          '<span class="link-name">' + escapeHtml(name) + '</span>' +
          (sub ? '<span class="link-sub">' + escapeHtml(sub) + '</span>' : '') +
        '</span>' +
        '<span class="link-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>';
      nav.appendChild(a);
    });
  }

  function renderSections(sections, lang){
    var wrap = document.getElementById('sections-wrap');
    if(!wrap) return;
    wrap.innerHTML = '';
    if(!sections || !sections.length) return;
    sections.forEach(function(sec){
      var title = (lang === 'ar' && sec.title_ar) ? sec.title_ar : sec.title_en;
      var desc = (lang === 'ar' && sec.description_ar) ? sec.description_ar : sec.description_en;
      var card = document.createElement('div');
      card.className = 'info-card';
      card.style.textAlign = 'left';
      card.style.margin = '10px 0';
      card.innerHTML =
        '<span class="info-icon" aria-hidden="true">' + escapeHtml(sec.icon || '✨') + '</span>' +
        '<p class="info-label" style="font-size:14px;text-transform:none;letter-spacing:0;color:var(--text);font-weight:700;margin-bottom:6px;">' + escapeHtml(title) + '</p>' +
        (desc ? '<p class="info-value" style="text-align:left;font-weight:500;color:var(--text-2);">' + escapeHtml(desc) + '</p>' : '');
      wrap.appendChild(card);
    });
  }

  function applySettings(settings){
    if(!settings) return;
    var r = document.documentElement;
    if(settings.accent) r.style.setProperty('--accent', settings.accent);
    if(settings.accent2) r.style.setProperty('--accent-2', settings.accent2);
    if(settings.radiusLg) r.style.setProperty('--radius-lg', settings.radiusLg);
    if(settings.radiusMd) r.style.setProperty('--radius-md', settings.radiusMd);
  }

  var siteData = null;
  fetch('/api/site').then(function(r){ return r.json(); }).then(function(data){
    siteData = data;
    var p = data.profile || {};
    STRINGS.en.badge = p.badge_en || STRINGS.en.badge;
    STRINGS.ar.badge = p.badge_ar || STRINGS.ar.badge;
    STRINGS.en.name = p.name_en || STRINGS.en.name;
    STRINGS.ar.name = p.name_ar || STRINGS.ar.name;
    STRINGS.en.subtitle = p.subtitle_en || STRINGS.en.subtitle;
    STRINGS.ar.subtitle = p.subtitle_ar || STRINGS.ar.subtitle;
    STRINGS.en.uniValue = p.university_en || STRINGS.en.uniValue;
    STRINGS.ar.uniValue = p.university_ar || STRINGS.ar.uniValue;
    STRINGS.en.yearValue = p.year_en || STRINGS.en.yearValue;
    STRINGS.ar.yearValue = p.year_ar || STRINGS.ar.yearValue;
    STRINGS.en.collegeValue = p.college_en || STRINGS.en.collegeValue;
    STRINGS.ar.collegeValue = p.college_ar || STRINGS.ar.collegeValue;
    STRINGS.en.footer = p.footer_en || STRINGS.en.footer;
    STRINGS.ar.footer = p.footer_ar || STRINGS.ar.footer;
    STRINGS.en.footerUni = p.footerUni_en || STRINGS.en.footerUni;
    STRINGS.ar.footerUni = p.footerUni_ar || STRINGS.ar.footerUni;

    if(p.profileImage){
      var img = document.getElementById('avatar-img');
      if(img) img.src = p.profileImage;
    }

    var currentLang = root.getAttribute('lang') || 'en';
    renderLinks(data.socialLinks || [], currentLang);
    renderSections(data.sections || [], currentLang);
    applySettings(data.settings);
    if(!savedTheme && data.settings && data.settings.theme){
      applyTheme(data.settings.theme, false);
    }
    applyLang(currentLang, false);

    // keep dynamic bits in sync when the language toggle is used
    btnEn.addEventListener('click', function(){
      renderLinks(data.socialLinks || [], 'en');
      renderSections(data.sections || [], 'en');
    });
    btnAr.addEventListener('click', function(){
      renderLinks(data.socialLinks || [], 'ar');
      renderSections(data.sections || [], 'ar');
    });
  }).catch(function(){
    /* offline / static preview: keep the built-in default content */
  });
})();
</script>

</body>
</html>
