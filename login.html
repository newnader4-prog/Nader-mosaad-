<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login — Dr Nader Mosaad</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#05090E; --card:#0C131B; --card-line:rgba(143,165,173,0.14);
    --accent:#1CE1C0; --accent-2:#588AFF; --text:#F5FFFF; --text-2:#8FA5AD;
    --glass:rgba(12,19,27,0.6); --danger:#FF6B6B; --radius-lg:22px; --radius-md:14px;
    --ease: cubic-bezier(.16,.84,.44,1);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100svh; background:
      radial-gradient(60% 50% at 18% 8%, color-mix(in srgb, var(--accent) 16%, transparent) 0%, transparent 60%),
      radial-gradient(55% 45% at 88% 18%, color-mix(in srgb, var(--accent-2) 14%, transparent) 0%, transparent 60%),
      var(--bg-0);
    color:var(--text); font-family:'Manrope',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card{
    width:100%; max-width:400px; background:var(--glass); border:1px solid var(--card-line);
    border-radius:var(--radius-lg); padding:36px 28px; backdrop-filter:blur(20px) saturate(140%);
    box-shadow:0 30px 80px -30px rgba(0,0,0,.65);
  }
  .lock{
    width:52px; height:52px; border-radius:50%; margin:0 auto 18px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 25%, var(--card)), color-mix(in srgb, var(--accent-2) 20%, var(--card)));
    border:1px solid color-mix(in srgb, var(--accent) 40%, var(--card-line));
  }
  .lock svg{ width:22px; height:22px; color:var(--accent); }
  h1{ font-family:'Space Grotesk',sans-serif; font-size:20px; text-align:center; margin:0 0 4px; }
  p.sub{ text-align:center; color:var(--text-2); font-size:13px; margin:0 0 26px; }
  label{ display:block; font-size:12px; font-weight:700; color:var(--text-2); margin:14px 0 6px; text-transform:uppercase; letter-spacing:.06em; }
  input[type=email], input[type=password], input[type=text]{
    width:100%; padding:12px 14px; border-radius:var(--radius-md); border:1px solid var(--card-line);
    background:rgba(255,255,255,.03); color:var(--text); font-size:14px; font-family:inherit;
    transition:border-color .3s var(--ease);
  }
  input:focus{ outline:none; border-color:var(--accent); }
  .remember{ display:flex; align-items:center; gap:8px; margin-top:16px; font-size:13px; color:var(--text-2); }
  .remember input{ width:16px; height:16px; }
  button{
    width:100%; margin-top:22px; padding:13px; border:none; border-radius:999px; cursor:pointer;
    font-family:inherit; font-weight:700; font-size:14px; color:#031013;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow:0 10px 30px -10px color-mix(in srgb, var(--accent) 50%, transparent);
    transition:transform .2s var(--ease), opacity .2s var(--ease);
  }
  button:hover{ transform:translateY(-1px); }
  button:disabled{ opacity:.6; cursor:not-allowed; transform:none; }
  .error{
    margin-top:14px; padding:10px 12px; border-radius:10px; font-size:13px;
    background:color-mix(in srgb, var(--danger) 14%, transparent); border:1px solid color-mix(in srgb, var(--danger) 35%, transparent);
    color:var(--danger); display:none;
  }
  .backlink{ display:block; text-align:center; margin-top:20px; color:var(--text-2); font-size:12.5px; text-decoration:none; }
  .backlink:hover{ color:var(--accent); }
  .spinner{ display:inline-block; width:14px; height:14px; border:2px solid rgba(3,16,19,.35); border-top-color:#031013; border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; margin-inline-end:8px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .hidden{ display:none !important; }
</style>
</head>
<body>
  <div class="card">
    <div class="lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>

    <div id="setup-view" class="hidden">
      <h1>Create your admin account</h1>
      <p class="sub">No admin account exists yet. This runs once.</p>
      <form id="setup-form">
        <label for="setup-email">Email</label>
        <input type="email" id="setup-email" autocomplete="email" required />
        <label for="setup-password">Password</label>
        <input type="password" id="setup-password" autocomplete="new-password" minlength="8" required />
        <p class="sub" style="margin:6px 0 0;text-align:left;">At least 8 characters.</p>
        <button type="submit" id="setup-btn">Create account</button>
      </form>
      <div class="error" id="setup-error"></div>
    </div>

    <div id="login-view" class="hidden">
      <h1>Admin sign in</h1>
      <p class="sub">Manage the site content</p>
      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required />
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required />
        <label class="remember"><input type="checkbox" id="remember" /> Remember me for 30 days</label>
        <button type="submit" id="login-btn">Sign in</button>
      </form>
      <div class="error" id="login-error"></div>
    </div>

    <a class="backlink" href="/">&larr; Back to site</a>
  </div>

<script>
(function(){
  "use strict";
  var setupView = document.getElementById('setup-view');
  var loginView = document.getElementById('login-view');

  function showError(el, msg){ el.textContent = msg; el.style.display = 'block'; }
  function hideError(el){ el.style.display = 'none'; }

  // decide setup vs login by attempting a harmless setup POST is unsafe; instead ask /api/auth/me
  // and try a lightweight probe: attempt setup endpoint detection via a dedicated check.
  fetch('/api/admin/state', { credentials: 'same-origin' }).then(function(){}).catch(function(){});
  fetch('/api/auth/me', { credentials:'same-origin' }).then(function(r){ return r.json(); }).then(function(me){
    if(me.authenticated){ window.location.href = '/admin/dashboard'; return; }
    // probe setup availability
    return fetch('/api/auth/setup', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({}) })
      .then(function(r){
        if(r.status === 403){ loginView.classList.remove('hidden'); }
        else { setupView.classList.remove('hidden'); }
      });
  }).catch(function(){ loginView.classList.remove('hidden'); });

  document.getElementById('setup-form').addEventListener('submit', function(e){
    e.preventDefault();
    var btn = document.getElementById('setup-btn');
    var err = document.getElementById('setup-error');
    hideError(err);
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Creating…';
    fetch('/api/auth/setup', {
      method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin',
      body: JSON.stringify({
        email: document.getElementById('setup-email').value,
        password: document.getElementById('setup-password').value
      })
    }).then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
      .then(function(res){
        if(!res.ok){ throw new Error(res.d.error || 'FAILED'); }
        setupView.classList.add('hidden');
        loginView.classList.remove('hidden');
      }).catch(function(e){
        showError(err, e.message === 'WEAK_PASSWORD' ? 'Password must be at least 8 characters.' : (e.message === 'INVALID_EMAIL' ? 'Enter a valid email.' : 'Could not create account.'));
      }).finally(function(){ btn.disabled = false; btn.textContent = 'Create account'; });
  });

  document.getElementById('login-form').addEventListener('submit', function(e){
    e.preventDefault();
    var btn = document.getElementById('login-btn');
    var err = document.getElementById('login-error');
    hideError(err);
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Signing in…';
    fetch('/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin',
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        remember: document.getElementById('remember').checked
      })
    }).then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
      .then(function(res){
        if(!res.ok){ throw new Error(res.d.error || 'FAILED'); }
        window.location.href = '/admin/dashboard';
      }).catch(function(e){
        showError(err, e.message === 'TOO_MANY_ATTEMPTS' ? 'Too many attempts. Try again later.' : 'Invalid email or password.');
      }).finally(function(){ btn.disabled = false; btn.textContent = 'Sign in'; });
  });
})();
</script>
</body>
</html>
